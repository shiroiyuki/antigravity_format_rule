name: CI & Release Flow

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    name: Validate Standards & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Validate format_customizations.md
        run: |
          python scripts/validate.py format_customizations.md

      - name: Run Validator Unit Tests
        run: |
          python -m unittest discover tests

  release:
    name: Create GitHub Release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Package Release Assets
        run: |
          VERSION="${GITHUB_REF_NAME}"
          ARCHIVE_NAME="antigravity_format_rule-${VERSION}.tar.gz"
          tar -czvf "${ARCHIVE_NAME}" format_customizations.md README.md install.sh scripts/
          sha256sum "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            antigravity_format_rule-*.tar.gz
            antigravity_format_rule-*.tar.gz.sha256
            format_customizations.md
            install.sh
          generate_release_notes: true
          draft: false
          prerelease: false
