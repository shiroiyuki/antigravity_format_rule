name: CI & Release Flow

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    name: Validate Standards & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Run Validator Unit Tests
        run: |
          python -m unittest discover tests

      - name: Validate format_customizations.md
        run: |
          python scripts/validate.py format_customizations.md

  release:
    name: Create GitHub Release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (Full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Release Notes
        run: |
          VERSION="${GITHUB_REF_NAME}"
          PREV_TAG=$(git describe --tags --abbrev=0 "${VERSION}^" 2>/dev/null || echo "")

          cat << 'EOF' > release_notes.md
          ### 📦 Quick Install (快速安裝)
          ```bash
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/install.sh | bash
          ```

          ### 🔒 Integrity Verification (安全防偽校驗)
          發布資產附帶 \`.sha256\` 數位指紋檔案。下載後可在終端執行以下標準指令進行一鍵無人值守校驗：
          ```bash
          sha256sum -c antigravity_format_rule-${{ github.ref_name }}.tar.gz.sha256
          ```

          ### 📝 Commit Log
          EOF

          if [ -n "$PREV_TAG" ]; then
            git log "${PREV_TAG}..${VERSION}" --pretty=format:"* %s (%h)" >> release_notes.md
          else
            git log "${VERSION}" --pretty=format:"* %s (%h)" >> release_notes.md
          fi
          echo "" >> release_notes.md

      - name: Package Release Assets
        run: |
          VERSION="${GITHUB_REF_NAME}"
          ARCHIVE_NAME="antigravity_format_rule-${VERSION}.tar.gz"
          tar -czvf "${ARCHIVE_NAME}" format_customizations.md README.md install.sh scripts/
          sha256sum "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: |
            antigravity_format_rule-*.tar.gz
            antigravity_format_rule-*.tar.gz.sha256
            format_customizations.md
            install.sh
          generate_release_notes: true
          draft: false
          prerelease: false
